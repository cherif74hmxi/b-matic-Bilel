<!doctype html>
<html lang="fr-BE">
  <head>
    <meta charset="UTF-8" />
    <!-- Polices (Orbitron / Inter) hébergées en local via @fontsource, importées dans src/main.tsx -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Thème clair par défaut ; thème sombre mémorisé (bouton soleil / lune) appliqué AVANT
         le premier affichage pour éviter un flash. Même clé et couleurs que src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("bmatic-theme") === "sombre") {
            document.documentElement.setAttribute("data-theme", "sombre");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f0d17");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="author" content="B MATIC" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Bloc remplacé page par page au build (vite-plugin-seo.ts) et par api/share.ts -->
    <!--seo-->
    <title>B MATIC — Pare-brise à Ans (Liège) | Jusqu'à 300 € ou un cadeau</title>
    <meta name="description" content="Pare-brise à Ans (Liège) : toutes assurances, franchise prise en charge selon votre contrat, jusqu'à 300 € ou un cadeau. Au centre ou à domicile, 7j/7." />
    <meta property="og:site_name" content="B MATIC" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="B MATIC — Remplacement pare-brise à Liège" />
    <meta property="og:description" content="Jusqu'à 300 € ou un cadeau pour votre pare-brise remplacé. Toutes assurances, franchise prise en charge selon votre contrat, au centre ou à domicile, 7j/7." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--/seo-->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
