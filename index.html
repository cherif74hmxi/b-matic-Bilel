<!doctype html>
<html lang="fr-BE">
  <head>
    <meta charset="UTF-8" />
    <!-- Polices (Poppins / Inter) hébergées en local via @fontsource, importées dans src/main.tsx -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Thème clair par défaut ; thème sombre mémorisé (bouton soleil / lune) appliqué AVANT
         le premier affichage pour éviter un flash. Même clé et couleurs que src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("bmatic-theme") === "sombre") {
            document.documentElement.setAttribute("data-theme", "sombre");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f0d17");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Consent Mode v2 : tout « denied » par défaut, AVANT GTM. GTM (qui porte GA4) n'est
         chargé qu'avec un accord : choix mémorisé ici, nouveau choix via src/lib/consent.ts
         (même clé, testé). Pas de GA4 en direct : tout passe par GTM. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
      });
      window.bmaticLoadGtm = function () {
        if (window.bmaticGtmLoaded || location.pathname.indexOf("/admin") === 0) return;
        window.bmaticGtmLoaded = true;
        // Google Tag Manager (extrait officiel)
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-W2CZ7DTJ');
        // End Google Tag Manager
      };
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem("bmatic-cookie-consent"));
          if (!c || c.v !== 2) return;
          gtag("consent", "update", {
            analytics_storage: c.analytics === true ? "granted" : "denied",
            ad_storage: c.marketing === true ? "granted" : "denied",
            ad_user_data: c.marketing === true ? "granted" : "denied",
            ad_personalization: c.marketing === true ? "granted" : "denied",
          });
          if (c.analytics === true || c.marketing === true) window.bmaticLoadGtm();
        } catch (e) {}
      })();
    </script>
    <meta name="author" content="B MATIC" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Bloc remplacé page par page au build (vite-plugin-seo.ts) et par api/share.ts -->
    <!--seo-->
    <title>B MATIC — Remplacement de pare-brise à Ans (Liège)</title>
    <meta name="description" content="Pare-brise à Ans (Liège) : toutes assurances, franchise prise en charge selon votre contrat, jusqu'à 300 € ou un cadeau. Au centre ou à domicile, 7j/7." />
    <meta property="og:site_name" content="B MATIC" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="B MATIC — Remplacement de pare-brise à Ans (Liège)" />
    <meta property="og:description" content="Jusqu'à 300 € ou un cadeau pour votre pare-brise remplacé. Toutes assurances, franchise prise en charge selon votre contrat, au centre ou à domicile, 7j/7." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--/seo-->
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W2CZ7DTJ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
