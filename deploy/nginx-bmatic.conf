# B MATIC — nginx : proxy vers le serveur Node (127.0.0.1:3000).
# certbot ajoutera automatiquement le bloc HTTPS (443) et la redirection 80 -> 443.
#
# Installation :
#   sudo cp deploy/nginx-bmatic.conf /etc/nginx/sites-available/bmatic
#   sudo ln -sf /etc/nginx/sites-available/bmatic /etc/nginx/sites-enabled/bmatic
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bmatic-pare-brise.com -d www.bmatic-pare-brise.com

server {
    listen 80;
    listen [::]:80;
    server_name bmatic-pare-brise.com www.bmatic-pare-brise.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
